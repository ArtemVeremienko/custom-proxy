<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Private proxy</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>Private proxy</h1>
  <p>Use the hostname on your proxy's TLS certificate.</p>
  <form id="connection">
    <label>Hostname<input name="host" required placeholder="proxy.example.com" autocomplete="off"></label>
    <label>Port<input name="port" type="number" min="1" max="65535" value="3129" required></label>
    <label>Username<input name="username" required autocomplete="username"></label>
    <label>Password<input name="password" type="password" required autocomplete="off"></label>
    <div class="buttons"><button type="submit">Connect</button><button id="disconnect" type="button">Disconnect</button></div>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <small>Passwords are kept for this browser session. Connecting applies settings; open a website to verify connectivity.</small>
  <script type="module" src="popup.js"></script>
</body>
</html>
